# Config for code/train/train_gme.py

manifest: "output/Manifests/BLCA_seed42/fusion_manifest.csv"
build_manifest: false
feat_base: "Q:/TCGA-BLCA-features/20x_256px_0px_overlap"
feature_dirs:
  - "features_uni_v1"
  - "features_conch_v15"
  # - "features_gigapath"
  # - "features_virchow2"
  # - "features_hoptimus0"
  
manifest_dir: "output/Manifests/BLCA_seed42"
cv_folds: 5

clinical_path: "G:/Fanglun/Project/UM/dataset/BLCA/task.csv"
output_dir: "G:/Fanglun/Project/UM/output/GME"
experiment_name: "BLCA"        # UVM or BLCA
workflow_mode: "fusion_only"  # fusion_only | analysis_only | fusion_and_analysis
analysis_source_run_dir: null            # analysis_only need fusion result dir
folds: null     
training_protocol: "fixed_split_no_refit"  # nested_refit or fixed_split_no_refit; use folds: [1] to train once
seed: 42     # seed 42 2026 2027
device: "cuda"
gpu_id: 1

target_dim: 512
projection_dropout: 0.1
d_inner: 256
d_attn: 128
droprate: 0.25
n_classes: 2
downstream_head: "ABMIL"   # ABMIL | TransMIL | GNN | MLP

stage2_epochs: 100
patience: 7
inner_val_fraction: 0.2
lr_stage2: 0.0001
weight_decay: 0.001
grad_clip: 5.0

routing_mode: "teacher_student"  # online_attribution or teacher_student
teacher_epochs: 100
teacher_patience: 5
teacher_lr: 0.0001
mean_fusion_warm_start: true    # false for ablation
student_router_use_consensus: true   # false disables consensus in both modes
student_router_consensus_mode: "mean"  # mean | learnable
teacher_freeze_projection: false

max_patches: 0
eval_max_patches: 0
baseline_max_patches: 0
profile_samples: 10
profile_warmup: 10
profile_repeat: 20
save_fused_h5: false
