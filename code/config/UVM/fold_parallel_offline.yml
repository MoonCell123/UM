# Config for code/train/launch_fold_parallel.py
# This launcher runs train_offline_fusion_baselines.py across two GPUs by fold.

target: "offline"
train_config: "code/config/offline_fusion_baselines.yml"
gpus:
  - "0"
  - "1"
folds:
  - 1
  - 2
  - 3
  - 4
  - 5
split_mode: "contiguous"
experiment_name: null
output_dir: null
launch_output_dir: "output/Fold_Parallel"
python: null
dry_run: false

# Extra args passed to the target training script.
# Examples:
#   extra_args: "--methods mean concat"
#   extra_args:
#     - "--methods"
#     - "mean"
#     - "concat"
extra_args: []
