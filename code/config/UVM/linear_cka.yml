# Config for code/evaluation/compute_linear_cka.py

manifest: "output/Manifests/Manifests_seed2026/manifest.csv"
output_dir: "output/Linear_CKA"

feature_dirs:
  - "features_conch_v15"
  - "features_gigapath"
  - "features_hibou_l"
  - "features_hoptimus0"
  - "features_hoptimus1"
  - "features_midnight12k"
  - "features_phikon"
  - "features_phikon_v2"
  - "features_uni_v1"
  - "features_uni_v2"
  - "features_virchow"
  - "features_virchow2"

# 0 uses all coordinate-aligned patches. 1024 is a deterministic estimate.
max_patches: 1024
seed: 42
device: "cuda:0"
dtype: "float32"
strict: false

# Optional. Leave unset to process every complete WSI.
# slide_ids: ["TCGA-XXXX-01A", "TCGA-YYYY-01A"]
