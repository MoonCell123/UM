# Config for code/train/train_gme.py

manifest: "output/Middle_Fusion_Manifests/middle_fusion_manifest.csv"
build_manifest: false
feat_base: "L:/20x_256px_0px_overlap"
feature_dirs:
  - "features_hoptimus1"
  - "features_virchow"
  - "features_hoptimus0"
  - "features_gigapath"
  - "features_uni_v1"
manifest_dir: "output/Middle_Fusion_Manifests"
cv_folds: 5

clinical_path: "G:/Fanglun/Project/UM/clinical_information.csv"
output_dir: "output/GME"
experiment_name: "gme"
label_col: "d3m3"
folds: null     
training_protocol: "fixed_split_no_refit"  # nested_refit or fixed_split_no_refit; use folds: [1] to train once
seed: 42
device: "cuda"
gpu_id: 1

target_dim: 512
projection_dropout: 0.1
d_inner: 256
d_attn: 128
droprate: 0.25
n_classes: 2

stage1_epochs: 0
stage1_patience: 5
lr_stage1: 0.0
stage1_beacon_mode: "none"
stage1_consistency_weight: 0.5
stage1_max_patches: 1024
stage1_eval_max_patches: 1024
freeze_projection_stage2: false
stage2_warm_start_classifier: false

stage2_epochs: 80
patience: 7
inner_val_fraction: 0.2
lr_stage2: 0.0001
weight_decay: 0.001
grad_clip: 5.0

weight_averaging: "none"    # ema or none
ema_decay: 0.99
ema_start_epoch: 2   
threshold: 0.5

replacement_strategy: "mean"    # embedding mask way
gaussian_std_scale: 1.0
attribution_target: "predicted_class"
interaction_pair_beta: 0.0
interaction_pair_lr: 0.001
interaction_pair_weight_decay: 0.01
interaction_rms_clip: 3.0
beacon_constraint_weight: 0.05
adaptive_beacon_weight: false
beacon_loss_ratio: 1.0

routing_mode: "teacher_student"  # online_attribution or teacher_student
# teacher_student uses true-label LOO only to create frozen train-only targets.
teacher_epochs: 20
teacher_patience: 5
teacher_lr: 0.0001
teacher_distill_weight: 0.5
teacher_target_temperature: 1.0
teacher_target_clip: 3.0
student_router_hidden_dim: 64
student_router_temperature: 1.0
teacher_freeze_projection: true

max_patches: 0
eval_max_patches: 0
baseline_max_patches: 0
profile_samples: 10
profile_warmup: 10
profile_repeat: 20
save_fused_h5: false
